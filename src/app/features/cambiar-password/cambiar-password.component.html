<main class="password-shell">
  <section class="password-card">
    <span class="icono-principal">
      <lucide-icon [img]="iconos.seguridad" [size]="30" [strokeWidth]="1.8" />
    </span>

    <header>
      <span class="etiqueta">Primer acceso</span>
      <h1>Crea tu contraseña personal</h1>
      <p>
        Por seguridad, reemplaza la contraseña temporal antes de ingresar al
        flujo de caja de la empresa.
      </p>
    </header>

    <form [formGroup]="formulario" (ngSubmit)="guardar()">
      @if (mensajeError) {
        <div class="mensaje-error" role="alert">{{ mensajeError }}</div>
      }

      <label class="campo">
        <span>Contraseña temporal</span>
        <div class="entrada">
          <lucide-icon [img]="iconos.clave" [size]="18" />
          <input
            [type]="mostrarActual ? 'text' : 'password'"
            formControlName="passwordActual"
            autocomplete="current-password"
          />
          <button type="button" (click)="mostrarActual = !mostrarActual" aria-label="Mostrar u ocultar contraseña temporal">
            <lucide-icon [img]="mostrarActual ? iconos.ocultar : iconos.mostrar" [size]="18" />
          </button>
        </div>
      </label>

      <label class="campo">
        <span>Nueva contraseña</span>
        <div class="entrada">
          <lucide-icon [img]="iconos.clave" [size]="18" />
          <input
            [type]="mostrarNueva ? 'text' : 'password'"
            formControlName="nuevaPassword"
            autocomplete="new-password"
          />
          <button type="button" (click)="mostrarNueva = !mostrarNueva" aria-label="Mostrar u ocultar nueva contraseña">
            <lucide-icon [img]="mostrarNueva ? iconos.ocultar : iconos.mostrar" [size]="18" />
          </button>
        </div>
        <small>8 caracteres como mínimo, con mayúscula, minúscula y número.</small>
      </label>

      <label class="campo">
        <span>Confirmar nueva contraseña</span>
        <div class="entrada">
          <lucide-icon [img]="iconos.clave" [size]="18" />
          <input
            [type]="mostrarConfirmacion ? 'text' : 'password'"
            formControlName="confirmarPassword"
            autocomplete="new-password"
          />
          <button type="button" (click)="mostrarConfirmacion = !mostrarConfirmacion" aria-label="Mostrar u ocultar confirmación">
            <lucide-icon [img]="mostrarConfirmacion ? iconos.ocultar : iconos.mostrar" [size]="18" />
          </button>
        </div>
        @if (formulario.touched && formulario.hasError('passwordsNoCoinciden')) {
          <small class="error">Las contraseñas no coinciden.</small>
        }
      </label>

      <button class="boton-principal" type="submit" [disabled]="guardando">
        {{ guardando ? 'Actualizando...' : 'Guardar contraseña e ingresar' }}
      </button>
    </form>
  </section>
</main>
